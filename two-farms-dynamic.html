<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two farms, one harvest · Rwanda SAS 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EEF2EB; --panel:#E3E9E1; --ink:#14302A; --body:#2E4038; --muted:#56665E;
  --rule:#C9D3CA; --ssf:#E0A126; --lsf:#1F5A43; --neg:#A2401F; --pos:#1F5A43; --track:#D6DED6; --line:#8C9A91;
  --mapbase:#D3DCD2; --maphi:#1F5A43; --onink:#EEF2EB;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101C17; --panel:#17261F; --ink:#EAF2EC; --body:#C9D6CD; --muted:#9DB0A4;
    --rule:#2A3D33; --ssf:#F0B444; --lsf:#5FB38C; --neg:#F08A63; --pos:#6FCB9C; --track:#22352B; --line:#6E8378;
    --mapbase:#26392F; --maphi:#5FB38C; --onink:#101C17;
  }
}
:root[data-theme="dark"]{
  --ground:#101C17; --panel:#17261F; --ink:#EAF2EC; --body:#C9D6CD; --muted:#9DB0A4;
  --rule:#2A3D33; --ssf:#F0B444; --lsf:#5FB38C; --neg:#F08A63; --pos:#6FCB9C; --track:#22352B; --line:#6E8378;
  --mapbase:#26392F; --maphi:#5FB38C; --onink:#101C17;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
body{margin:0;background:var(--ground);color:var(--body);font-family:'Public Sans','Helvetica Neue',Helvetica,sans-serif;font-size:1.0625rem;line-height:1.55}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}
.display{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:72%;font-weight:850;color:var(--ink);line-height:.92;letter-spacing:-.01em}
h2{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:80%;font-weight:800;color:var(--ink);font-size:clamp(2rem,5vw,2.75rem);line-height:1;margin:0}
p{margin:0 0 1rem;max-width:40rem}
section{padding:3.5rem 0;border-top:1px solid var(--rule)}
.langbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--rule)}
.langbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:.4rem;padding-bottom:.4rem;flex-wrap:wrap}
.langbar .brand{font-weight:700;color:var(--ink);font-size:.95rem}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;color:var(--muted);font-size:.95rem;padding-top:2rem}
header h1{font-size:clamp(3.6rem,13vw,8.5rem);margin:1.25rem 0 1.25rem}
.lede{font-size:clamp(1.15rem,2.4vw,1.45rem);color:var(--body);max-width:38rem}
.legend{display:flex;gap:1.5rem;flex-wrap:wrap;font-weight:600;color:var(--ink);margin:1.5rem 0 3rem}
.legend span{display:flex;align-items:center;gap:.5rem}
.sw{width:1rem;height:1rem;border-radius:50%;display:inline-block}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem}
.listen{font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:999px;padding:.45rem 1rem;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem}
.listen[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.listen svg{width:1.1rem;height:1.1rem}
.note{font-size:.9rem;color:var(--muted);margin-top:.5rem;min-height:1.2em}
.land{display:flex;gap:2rem;align-items:center;flex-wrap:wrap}
.land .big{font-size:clamp(4rem,12vw,6.5rem)}
.land .txt{flex:1 1 18rem}
.bar{height:1.375rem;background:var(--track);margin-top:.75rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.toggle{display:inline-flex;border:2px solid var(--ink);margin:1rem 0 1.75rem;flex-wrap:wrap}
.toggle button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;padding:.6rem 1rem;min-height:44px;min-width:44px;cursor:pointer}
.toggle button+button{border-left:2px solid var(--ink)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.langbar .toggle{margin:0}
.langbar .toggle button{padding:.4rem .8rem;font-size:.95rem}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--ssf);outline-offset:2px}
.db-row{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:.25rem 1.25rem;align-items:center;margin-bottom:.9rem}
.db-label{font-weight:700;color:var(--ink)}
.db-gap{grid-column:2;font-size:.9rem;font-weight:700;margin-top:-.35rem}
.track{position:relative;height:3.6rem}
.track .base{position:absolute;left:0;right:0;top:2.4rem;height:1px;background:var(--rule)}
.track .span{position:absolute;top:2.35rem;height:4px;background:var(--line);transition:left .7s ease,width .7s ease}
.track .dot{position:absolute;top:1.85rem;width:1.3rem;height:1.3rem;margin-left:-.65rem;border-radius:50%;box-shadow:0 0 0 3px var(--ground);transition:left .7s ease}
.track .val{position:absolute;top:0;width:4.5rem;margin-left:-2.25rem;text-align:center;font-weight:700;color:var(--ink);font-size:.95rem;transition:left .7s ease}
.axis{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:1.25rem;color:var(--muted);font-size:.85rem}
.axis div{display:flex;justify-content:space-between}
@media (max-width:40rem){.db-row,.axis{grid-template-columns:1fr}.axis span:first-child{display:none}.db-gap{grid-column:1}}
.callout{background:var(--panel);padding:1.25rem 1.5rem;margin-top:1.5rem;color:var(--ink);max-width:40rem}
.blocks{display:flex;flex-direction:column;gap:1.5rem}
.brow .who{font-weight:700;color:var(--ink);margin-bottom:.5rem;display:flex;justify-content:space-between;max-width:40rem}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{width:2.4rem;height:2.4rem;position:relative;background:var(--track)}
.cell i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .5s ease}
.ratio{font-size:clamp(3.2rem,10vw,5.5rem);color:var(--neg);margin:.75rem 0 .25rem}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2rem;align-items:start}
.field label{display:block;font-weight:700;color:var(--ink);margin-bottom:.5rem}
.field output{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:78%;font-weight:800;font-size:2.5rem;color:var(--ink);display:block;line-height:1}
input[type=range]{width:100%;accent-color:var(--lsf);min-height:44px}
.res{display:flex;flex-direction:column;gap:1rem}
.res .r{border-top:4px solid var(--rule);padding-top:.6rem}
.res .r b{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:78%;font-size:2.2rem;color:var(--ink);display:block;line-height:1.05}
.res .r span{color:var(--muted);font-size:.95rem}
.res .r.s{border-top-color:var(--ssf)}.res .r.l{border-top-color:var(--lsf)}
.mapgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(14rem,2fr);gap:2rem;align-items:start}
@media (max-width:48rem){.mapgrid{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block}
.map path{fill:var(--mapbase);stroke:var(--ground);stroke-width:1.2;cursor:pointer;transition:fill .4s ease}
.map path.hi{fill:var(--maphi)}
.map path.sel{stroke:var(--ssf);stroke-width:3}
.map path:focus{outline:none}
.map path:focus-visible{stroke:var(--ssf);stroke-width:3}
.map text{font-size:11px;fill:var(--ink);pointer-events:none;font-weight:600}
.map text.on{fill:var(--onink)}
.dinfo{background:var(--panel);padding:1.25rem 1.5rem;color:var(--ink)}
.dinfo h3{margin:0 0 .25rem;font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:80%;font-size:1.9rem}
.mlegend{display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-top:.75rem}
.mlegend span{display:flex;align-items:center;gap:.4rem}
.mlegend i{width:1rem;height:1rem;display:inline-block}
.wheelgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;align-items:center}
@media (max-width:44rem){.wheelgrid{grid-template-columns:1fr}}
.wheel svg{width:100%;max-width:22rem;height:auto;display:block;margin:0 auto}
.wheel .arc{cursor:pointer;transition:opacity .3s ease}
.wheel .arc.dim{opacity:.35}
.wheel .arc:focus{outline:none}
.wheel .arc:focus-visible{stroke:var(--ssf);stroke-width:4}
.wheel .mo{font-size:11px;fill:var(--muted);font-weight:600}
.wheel .ctr{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:78%;font-weight:850;fill:var(--ink)}
.hbar{margin-bottom:1rem}
.hbar .lab{display:flex;justify-content:space-between;font-weight:600;color:var(--ink);margin-bottom:.3rem}
.hbar .t{height:1.5rem;background:var(--track)}
.hbar .t i{display:block;height:100%;background:var(--lsf);transition:width .7s ease}
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:2rem 1.5rem}
.pcol .crop{font-weight:700;color:var(--ink);font-size:1.15rem;border-top:4px solid var(--ink);padding-top:.6rem}
.pline{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.45rem 0;border-bottom:1px solid var(--rule)}
.pline b{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:78%;font-size:1.5rem;color:var(--ink)}
.up{color:var(--pos);font-weight:700}.down{color:var(--neg);font-weight:700}
.close{background:var(--ink);color:var(--onink);padding:3.5rem 0 3rem}
.close .display{color:var(--onink);font-size:clamp(2rem,5.5vw,3.25rem);font-stretch:85%;font-weight:750;line-height:1.1;max-width:46rem}
.close small{display:block;margin-top:2.5rem;font-size:.9rem;line-height:1.6;opacity:.85;max-width:46rem}
.muted{color:var(--muted);font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ask{display:flex;flex-direction:column;gap:1rem;max-width:44rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:.5rem 1rem;min-height:44px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.askrow{display:flex;gap:.5rem;flex-wrap:wrap}
.askrow input{flex:1 1 16rem;font:inherit;color:var(--ink);background:var(--ground);border:2px solid var(--ink);padding:.6rem .9rem;min-height:48px}
.btn{font:inherit;font-weight:700;color:var(--onink);background:var(--ink);border:2px solid var(--ink);padding:.6rem 1.2rem;min-height:48px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.thread{display:flex;flex-direction:column;gap:1rem}
.q{font-weight:700;color:var(--ink)}
.a{background:var(--panel);padding:1rem 1.25rem;white-space:pre-wrap;color:var(--ink)}
.a.err{color:var(--neg)}
.disclaim{font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="langbar"><div class="wrap">
  <span class="brand" data-i18n="brand"></span>
  <div class="toggle" role="group" aria-label="Language / Ururimi / Langue">
    <button type="button" data-lang="rw" aria-pressed="false" lang="rw">Kinyarwanda</button>
    <button type="button" data-lang="en" aria-pressed="true" lang="en">English</button>
    <button type="button" data-lang="fr" aria-pressed="false" lang="fr">Français</button>
  </div>
</div></div>

<header class="wrap" data-narrate="intro">
  <div class="meta"><span data-i18n="survey"></span><span data-i18n="year"></span></div>
  <h1 class="display" data-i18n-html="title"></h1>
  <p class="lede" data-i18n="lede"></p>
  <div class="legend"><span><i class="sw" style="background:var(--ssf)"></i><span data-i18n="ssf"></span></span><span><i class="sw" style="background:var(--lsf)"></i><span data-i18n="lsf"></span></span></div>
  <button type="button" class="listen" data-listen="intro"></button>
  <div class="note" data-note="intro" aria-live="polite"></div>
  <div style="height:2rem"></div>
</header>

<main>
<section data-narrate="land"><div class="wrap land">
  <div class="display big" id="landNum">0%</div>
  <div class="txt">
    <p style="margin:0" data-i18n="land"></p>
    <div class="bar" aria-hidden="true"><i id="landBar"></i></div>
  </div>
</div></section>

<section data-narrate="gap"><div class="wrap">
  <div class="head"><h2 data-i18n="gapH"></h2><button type="button" class="listen" data-listen="gap"></button></div>
  <div class="note" data-note="gap" aria-live="polite"></div>
  <p data-i18n="gapP"></p>
  <div class="toggle" role="group" data-i18n-aria="seasonPick">
    <button type="button" data-gap="A" aria-pressed="true"></button>
    <button type="button" data-gap="B" aria-pressed="false"></button>
  </div>
  <div class="axis" aria-hidden="true"><span></span><div><span>0%</span><span>50%</span><span>100%</span></div></div>
  <div id="dumbbell"></div>
  <div class="callout" id="gapCallout"></div>
</div></section>

<section data-narrate="yield"><div class="wrap">
  <div class="head"><h2 data-i18n="yieldH"></h2><button type="button" class="listen" data-listen="yield"></button></div>
  <div class="note" data-note="yield" aria-live="polite"></div>
  <p data-i18n="yieldP"></p>
  <div class="toggle" role="group" data-i18n-aria="cropPick">
    <button type="button" data-crop="maize" aria-pressed="true"></button>
    <button type="button" data-crop="potato" aria-pressed="false"></button>
  </div>
  <div class="blocks" id="blocks"></div>
  <p class="display ratio" id="ratio"></p>
  <p class="muted" id="ratioNote"></p>
</div></section>

<section data-narrate="calc"><div class="wrap">
  <div class="head"><h2 data-i18n="calcH"></h2><button type="button" class="listen" data-listen="calc"></button></div>
  <div class="note" data-note="calc" aria-live="polite"></div>
  <p data-i18n="calcP"></p>
  <div class="toggle" role="group" data-i18n-aria="cropPick">
    <button type="button" data-ccrop="maize" aria-pressed="true"></button>
    <button type="button" data-ccrop="potato" aria-pressed="false"></button>
  </div>
  <div class="calc">
    <div class="field">
      <label for="area" data-i18n="areaL"></label>
      <output id="areaOut" for="area"></output>
      <input type="range" id="area" min="0.1" max="5" step="0.1" value="0.5">
      <p class="muted" style="margin-top:.5rem" data-i18n="calcNote"></p>
    </div>
    <div class="res" aria-live="polite">
      <div class="r s"><span data-i18n="ssf"></span><b id="cS"></b><span id="cSb"></span></div>
      <div class="r l"><span data-i18n="lsf"></span><b id="cL"></b><span id="cLb"></span></div>
      <div class="r"><span data-i18n="diffL"></span><b id="cD" style="color:var(--neg)"></b><span id="cDb"></span></div>
    </div>
  </div>
</div></section>

<section data-narrate="map"><div class="wrap">
  <div class="head"><h2 data-i18n="mapH"></h2><button type="button" class="listen" data-listen="map"></button></div>
  <div class="note" data-note="map" aria-live="polite"></div>
  <p data-i18n="mapP"></p>
  <div class="toggle" role="group" data-i18n-aria="cropPick">
    <button type="button" data-mcrop="maize" aria-pressed="true"></button>
    <button type="button" data-mcrop="potato" aria-pressed="false"></button>
    <button type="button" data-mcrop="cassava" aria-pressed="false"></button>
    <button type="button" data-mcrop="sweet" aria-pressed="false"></button>
  </div>
  <div class="mapgrid">
    <div class="map"><svg id="mapSvg" viewBox="0 0 600 528" role="group"></svg>
      <div class="mlegend" id="mlegend"></div>
    </div>
    <div class="dinfo" id="dinfo" aria-live="polite"></div>
  </div>
</div></section>

<section data-narrate="season"><div class="wrap">
  <div class="head"><h2 data-i18n="seasonH"></h2><button type="button" class="listen" data-listen="season"></button></div>
  <div class="note" data-note="season" aria-live="polite"></div>
  <p data-i18n="seasonP"></p>
  <div class="wheelgrid">
    <div class="wheel"><svg id="wheel" viewBox="0 0 340 340" role="group"></svg></div>
    <div>
      <p class="muted" id="seasonMonths" style="font-weight:700;color:var(--ink)"></p>
      <div id="seasonBars"></div>
    </div>
  </div>
</div></section>

<section data-narrate="prod"><div class="wrap">
  <div class="head"><h2 data-i18n="prodH"></h2><button type="button" class="listen" data-listen="prod"></button></div>
  <div class="note" data-note="prod" aria-live="polite"></div>
  <p data-i18n="prodP"></p>
  <div class="prod" id="prod"></div>
</div></section>
<section id="askSec"><div class="wrap">
  <div class="head"><h2 data-i18n="askH"></h2></div>
  <p data-i18n="askP"></p>
  <div class="ask">
    <div class="chips" id="chips"></div>
    <form class="askrow" id="askForm">
      <label for="askIn" class="sr" data-i18n="askL"></label>
      <input id="askIn" type="text" autocomplete="off" maxlength="300">
      <button type="submit" class="btn" id="askBtn" data-i18n="askBtn"></button>
      <button type="button" class="btn ghost" id="stopBtn" hidden data-i18n="stop"></button>
    </form>
    <div class="thread" id="thread" aria-live="polite"></div>
    <p class="disclaim" id="askNote" data-i18n="askDisc"></p>
  </div>
</div></section>
</main>

<footer class="close" data-narrate="close"><div class="wrap">
  <p class="display" data-i18n="closing"></p>
  <button type="button" class="listen" data-listen="close" style="border-color:var(--onink);color:var(--onink)"></button>
  <div class="note" data-note="close" aria-live="polite" style="color:var(--onink);opacity:.8"></div>
  <small><span data-i18n="source"></span><br><span data-i18n="credit"></span></small>
</div></footer>

<script>
(function(){
/* ============ YOUR VOICE RECORDINGS ============
   Paste a recording for any section and language here, as a data: URI
   (e.g. "data:audio/mpeg;base64,...."). A recording always plays instead
   of the browser voice. Kinyarwanda needs recordings: browsers have no
   Kinyarwanda voice. Sections: intro, gap, yield, calc, map, season, prod, close */
var RECORDINGS = { rw:{}, en:{}, fr:{} };

/* ============ DISTRICT PRODUCTION (tonnes) ============
   Fill in from the district tables of the SAS Annual Report 2025.

  fr:'Le Rwanda couvre '+fm(d.total_ha,0,L)+' ha. Les terres agricoles représentaient '+fm(d.agricultural_ha_seasonA,0,L)+' ha ('+pc(d.agricultural_pct_seasonA,L)+') en saison A 2025 et '+fm(d.agricultural_ha_seasonB,0,L)+' ha ('+pc(d.agricultural_pct_seasonB,L)+') en saison B. En '+SY(s,L)+'\u00a0: '+fm(x.seasonal_crops_ha,0,L)+' ha de cultures saisonnières, '+fm(x.permanent_crops_ha,0,L)+' ha de cultures permanentes et '+fm(x.permanent_pasture_ha,0,L)+' ha de pâturages permanents.',
  rw:'U Rwanda rufite hegitari '+fm(d.total_ha,0,L)+'. Ubutaka bw\'ubuhinzi bwari hegitari '+fm(d.agricultural_ha_seasonA,0,L)+' ('+pc(d.agricultural_pct_seasonA,L)+') mu gihembwe A cya 2025 na hegitari '+fm(d.agricultural_ha_seasonB,0,L)+' ('+pc(d.agricultural_pct_seasonB,L)+') mu gihembwe B. Mu '+SY(s,L)+': hegitari '+fm(x.seasonal_crops_ha,0,L)+' z\'ibihingwa by\'igihembwe, hegitari '+fm(x.permanent_crops_ha,0,L)+' z\'ibihingwa bihoraho na hegitari '+fm(x.permanent_pasture_ha,0,L)+' z\'inzuri zihoraho.'});};
A.seasons=function(L,o){var m=T[L].sMonths,ss=o.season?[o.season]:['A','B','C'];var out=ss.map(function(s){return m[s]+'.';});
  if(ss.indexOf('C')>-1)out.push(pick(L,{en:'Season C is short and mostly farmed in swamps and the volcanic zone.',fr:'La saison C est courte, surtout dans les marais et la zone volcanique.',rw:'Igihembwe C ni gito, gihingwa cyane mu bishanga no mu karere k\'ibirunga.'}));return out.join('\n');};
A.pest_brand=function(L){var P=KB.most_used_pesticides_pct_of_users,a=P.seasonA,b=P.seasonB;return pick(L,{
  en:'Among farmers who used pesticides, Rocket was the most common: '+pc(a.Rocket,L)+' in Season A and '+pc(b.Rocket,L)+' in Season B 2025. Dithane followed ('+pc(a.Dithane,L)+' and '+pc(b.Dithane,L)+'), then Cypermethrin ('+pc(a.Cypermethrin,L)+' and '+pc(b.Cypermethrin,L)+').',
  fr:'Parmi les agriculteurs utilisant des pesticides, Rocket était le plus courant\u00a0: '+pc(a.Rocket,L)+' en saison A et '+pc(b.Rocket,L)+' en saison B 2025. Puis Dithane ('+pc(a.Dithane,L)+' et '+pc(b.Dithane,L)+') et Cypermethrin ('+pc(a.Cypermethrin,L)+' et '+pc(b.Cypermethrin,L)+').',
  rw:'Mu bahinzi bakoresheje imiti yica udukoko, Rocket ni wo muti wakoreshejwe cyane: '+pc(a.Rocket,L)+' mu gihembwe A na '+pc(b.Rocket,L)+' mu gihembwe B cya 2025. Hakurikiraho Dithane ('+pc(a.Dithane,L)+' na '+pc(b.Dithane,L)+') na Cypermethrin ('+pc(a.Cypermethrin,L)+' na '+pc(b.Cypermethrin,L)+').'});};
A.erosion=function(L){var v=pc(KB.other.soil_erosion_control_seasonB_pct_farmers,L);return pick(L,{
  en:'In Season B 2025, '+v+' of farmers had soil erosion control measures on their land.',fr:'En saison B 2025, '+v+' des agriculteurs avaient des mesures de lutte contre l\'érosion sur leurs terres.',rw:'Mu gihembwe B cya 2025, '+v+' by\'abahinzi bari bafite ingamba zo kurwanya isuri mu mirima yabo.'});};
A.about=function(L){return pick(L,{
  en:'The figures come from NISR\'s Seasonal Agricultural Survey Annual Report 2025, agricultural year 2024/2025. The survey covered 1,200 segments and about 380 large-scale farmers per season. This assistant works out its answers on your device from those figures only.',
  fr:'Les chiffres viennent du Rapport annuel 2025 de l\'Enquête agricole saisonnière du NISR, année agricole 2024/2025. L\'enquête a couvert 1\u00a0200 segments et environ 380 grands exploitants par saison. Cet assistant calcule ses réponses sur votre appareil, uniquement à partir de ces chiffres.',
  rw:'Iyi mibare ituruka muri Raporo y\'Umwaka y\'Ubushakashatsi ku Buhinzi bw\'Ibihembwe 2025 ya NISR, umwaka w\'ubuhinzi 2024/2025. Ubushakashatsi bwakorewe ku bice 1 200 no ku bahinzi banini bagera kuri 380 muri buri gihembwe. Uyu mufasha abara ibisubizo kuri telefone cyangwa mudasobwa yawe, akoresheje iyo mibare gusa.'})+'\n'+T[L].credit;};
A.greet=function(L,o){if(o.thanks)return pick(L,{en:'You\'re welcome! Ask another question any time.',fr:'Avec plaisir\u00a0! Posez une autre question quand vous voulez.',rw:'Murakoze namwe! Mushobora kubaza ikindi kibazo igihe cyose.'});
  var ex=T[L].askQs[0];return pick(L,{
  en:'Hello! I answer questions about the SAS 2025 figures on this page: yields, production, input use, top districts, land and seasons. Try: "'+ex+'"',
  fr:'Bonjour\u00a0! Je réponds aux questions sur les chiffres de l\'enquête SAS 2025 de cette page\u00a0: rendements, production, intrants, districts, terres et saisons. Essayez\u00a0: «\u00a0'+ex+'\u00a0»',
  rw:'Muraho! Nsubiza ibibazo ku mibare ya SAS 2025 iri kuri uru rupapuro: umusaruro, inyongeramusaruro, uturere, ubutaka n\'ibihembwe. Gerageza: "'+ex+'"'});};
A.other=function(L){return pick(L,{
  en:'I can only answer questions about the Seasonal Agricultural Survey 2025 figures on this page, such as yields, production, input use, top districts, land and seasons.',
  fr:'Je ne peux répondre qu\'aux questions sur les chiffres de l\'Enquête agricole saisonnière 2025 de cette page\u00a0: rendements, production, intrants, districts, terres et saisons.',
  rw:'Nshobora gusubiza gusa ibibazo ku mibare y\'Ubushakashatsi ku Buhinzi bw\'Ibihembwe 2025 iri kuri uru rupapuro: umusaruro, inyongeramusaruro, uturere, ubutaka n\'ibihembwe.'});};

var askCtx=null;
function localAnswer(q){
  var o=slots(q);o.raw=q;
  var li=nbPredict(NB_L,q),L=li.p>=0.6&&normQ(q).split(' ').length>1||li.p>=0.9?li.label:lang;
  var pi=nbPredict(NB_I,q),intent=pi.label,n=normQ(q),short=n.split(' ').length<=5;
  var marker=/^(and|what about|how about|et|et pour|et en|et la|et le|na|naho|ese na|none se)\b/.test(n),follow=marker||n.split(' ').length<=3&&pi.p<0.8&&!(intent==='other'&&pi.p>=0.5);
  if(askCtx&&follow&&(o.crop||o.season||o.input||o.district)&&intent!=='greet'){
    intent=askCtx.intent;['crop','season','input'].forEach(function(k){if(!o[k]&&askCtx.o[k]&&!(k==='season'&&o.crop))o[k]=askCtx.o[k];});}
  else if(intent!=='greet'&&intent!=='other'&&(!o.domain||pi.p<0.4))intent='other';
  if(o.other&&!o.crop&&['top_districts','yield','production','area'].indexOf(intent)>-1)
    return {L:L,text:noData(L,pick(L,{en:'figures for '+o.other,fr:'de chiffres pour '+o.other,rw:'imibare ya '+o.other}))};
  if(intent==='yield'&&(o.crop==='cassava'||o.crop==='sweet')&&!o.ha&&!/yield|rendement|hectare|hegitari|per ha| ha /.test(' '+n+' '))intent='production';
  if(intent==='input_gap'&&!o.farmer&&!/gap|ecart|cyuho|compar|gerer| vs |versus|contre|bato|banini/.test(' '+n+' '))intent='input_use';
  var text=(A[intent]||A.other)(L,o);
  if(o.why&&intent!=='other'&&intent!=='greet')text+='\n'+pick(L,{en:'The survey shows these differences but not their causes.',fr:'L\'enquête montre ces écarts, pas leurs causes.',rw:'Ubushakashatsi bugaragaza itandukaniro, ariko ntibugaragaza impamvu zaryo.'});
  if(L==='rw')text=text.replace(/\b(M|m)u igihembwe/g,'$1u gihembwe').replace(/\b(M|m)u ibihembwe/g,'$1u bihembwe');
  if(intent!=='other'&&intent!=='greet')askCtx={intent:intent,o:o};
  return {L:L,text:text,intent:intent};}
if(typeof module!=='undefined')module.exports={localAnswer:localAnswer,slots:slots};

/* UI */
var askBusy=false,typeTimer=null;
function drawChips(){var c=$('chips');c.textContent='';t('askQs').forEach(function(q){var b=el('button','chip',q);b.type='button';b.addEventListener('click',function(){$('askIn').value=q;ask(q);});c.appendChild(b);});
  $('askIn').setAttribute('placeholder',t('askPh'));}
function setAskEnabled(on){$('askIn').disabled=!on;$('askBtn').disabled=!on||askBusy;[].forEach.call(document.querySelectorAll('.chip'),function(b){b.disabled=!on||askBusy;});}
function ask(q){q=(q||'').trim();if(!q||askBusy)return;askBusy=true;setAskEnabled(true);
  var th=$('thread'),qd=el('div','q',q),ad=el('div','a',t('thinking'));th.insertBefore(ad,th.firstChild);th.insertBefore(qd,ad);
  setTimeout(function(){var res;try{res=localAnswer(q);}catch(e){ad.textContent=t('askFail');ad.classList.add('err');done();return;}
    ad.lang=res.L;var full=res.text,reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ad.textContent=full;done();return;}
    var i=0;$('stopBtn').hidden=false;typeTimer=setInterval(function(){i=Math.min(full.length,i+4);ad.textContent=full.slice(0,i);if(i>=full.length){clearInterval(typeTimer);typeTimer=null;ad.textContent=full;done();}},16);
    $('stopBtn').onclick=function(){if(typeTimer){clearInterval(typeTimer);typeTimer=null;ad.textContent=full;done();}};},220);
  function done(){askBusy=false;$('stopBtn').hidden=true;setAskEnabled(true);$('askIn').value='';}}
$('askForm').addEventListener('submit',function(e){e.preventDefault();ask($('askIn').value);});
setAskEnabled(true);


/* ---- Language ---- */
function applyLang(){document.documentElement.lang=lang;document.title=t('brand')+' · Rwanda SAS 2025';
  document.querySelectorAll('[data-i18n]').forEach(function(n){n.textContent=t(n.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-html]').forEach(function(n){n.innerHTML=t(n.getAttribute('data-i18n-html'));});
  document.querySelectorAll('[data-i18n-aria]').forEach(function(n){n.setAttribute('aria-label',t(n.getAttribute('data-i18n-aria')));});
  document.querySelectorAll('[data-gap]').forEach(function(b){b.textContent=t('season',{s:b.getAttribute('data-gap')});});
  ['data-crop','data-ccrop','data-mcrop'].forEach(function(a){document.querySelectorAll('['+a+']').forEach(function(b){b.textContent=t(b.getAttribute(a));});});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false');});
  svg.setAttribute('aria-label',t('mapH'));W.setAttribute('aria-label',t('seasonH'));
  drawGap();drawYield();drawCalc();drawMap();drawSeason();drawProd();paintListen();drawChips();setAskEnabled(true);}
document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){stopAll();lang=b.getAttribute('data-lang');try{localStorage.setItem('tf-lang',lang);}catch(e){}applyLang();});});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){};
applyLang();
})();
</script>
